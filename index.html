<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-card { background: #fff; width: 100%; max-width: 480px; height: 90vh; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #ff4b72; color: white; padding: 16px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .status-bar { background: #fff0f3; padding: 8px 16px; font-size: 0.85rem; color: #ff4b72; text-align: center; border-bottom: 1px solid #ffe0e6; }
        .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .sent { background: #ff4b72; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .received { background: #e4e6eb; color: #050505; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { padding: 12px; background: white; border-top: 1px solid #eee; display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: #ff4b72; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        button:hover { background: #e03a5f; }
        .setup-panel { padding: 16px; background: #fff; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 8px; }
        .setup-panel input { width: 100%; }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="header">Private Chat ♥</div>
    
    <div class="setup-panel" id="setup">
        <label style="font-size: 0.85rem; color: #666;">Who are you?</label>
        <select id="userSelect" onchange="initUser()" style="padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
            <option value="">-- Select Profile --</option>
            <option value="user">Me</option>
            <option value="sailakshmi">Sailakshmi</option>
        </select>
    </div>

    <div class="status-bar" id="status">Select profile to connect...</div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let peer = null;
    let conn = null;
    let myRole = "";

    function initUser() {
        const select = document.getElementById('userSelect');
        myRole = select.value;
        if (!myRole) return;

        document.getElementById('setup').style.display = 'none';
        
        const myPeerId = myRole === "user" ? "chat-room-user-id" : "chat-room-sailakshmi-id";
        const targetPeerId = myRole === "user" ? "chat-room-sailakshmi-id" : "chat-room-user-id";

        document.getElementById('status').innerText = "Connecting to network...";

        peer = new Peer(myPeerId);

        peer.on('open', (id) => {
            document.getElementById('status').innerText = "Waiting for connection...";
            connectToPeer(targetPeerId);
        });

        peer.on('connection', (c) => {
            conn = c;
            setupConnection();
        });

        peer.on('error', (err) => {
            // If ID exists, attempt connection directly
            if (err.type === 'unavailable-id') {
                connectToPeer(targetPeerId);
            }
        });
    }

    function connectToPeer(targetId) {
        conn = peer.connect(targetId);
        setupConnection();
    }

    function setupConnection() {
        conn.on('open', () => {
            document.getElementById('status').innerText = "Connected! Direct line active.";
        });

        conn.on('data', (data) => {
            appendMessage(data, 'received');
        });

        conn.on('close', () => {
            document.getElementById('status').innerText = "Disconnected.";
        });
    }

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !conn) return;

        conn.send(text);
        appendMessage(text, 'sent');
        input.value = '';
    }

    function appendMessage(text, type) {
        const box = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerText = text;
        box.appendChild(msgDiv);
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
